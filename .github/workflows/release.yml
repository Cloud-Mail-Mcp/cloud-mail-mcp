# Publishes the Docker image to GitHub Container Registry for whichever repository runs this
# workflow — the original project or anyone's fork — so every copy can ship its own builds.
#
#   push to main      → ghcr.io/<owner>/<repo>:edge        ("Every change" update channel)
#   push tag v1.2.3   → :1.2.3, :1.2, :latest               ("Stable releases" channel)
#                       + a GitHub release with install.sh and compose.yml attached
#
# After the first publish, make the package public once:
#   GitHub → your profile/org → Packages → mailmcp → Package settings → Change visibility → Public
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MAILMCP_VERSION=${{ steps.v.outputs.version }}
            MAILMCP_REVISION=${{ github.sha }}
            MAILMCP_REPO=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare install assets for this repository
        run: |
          mkdir -p dist
          sed "s|__REPO__|${GITHUB_REPOSITORY}|" deploy/install.sh > dist/install.sh
          cp deploy/compose.yml dist/compose.yml
          grep -q "$GITHUB_REPOSITORY" dist/install.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/install.sh dist/compose.yml \
            --title "MailMCP $GITHUB_REF_NAME" --generate-notes --verify-tag
