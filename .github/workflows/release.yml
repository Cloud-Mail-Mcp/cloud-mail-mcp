# Builds and publishes MailMCP for every install method AT ONCE, for whichever repository runs
# this workflow — the original project or anyone's fork.
#
#   push tag v1.2.3  (stable)            push to main  (edge)
#   ──────────────────────────────       ──────────────────────────────
#   image  ghcr.io/<repo>:1.2.3, :1.2,   image  ghcr.io/<repo>:edge
#          :latest                        branch dist-edge  (Node bundle)
#   branch dist  (Node bundle, for Enhance / git-deploy hosts)
#   GitHub release with install.sh, compose.yml, mailmcp-node-1.2.3.zip
#
# Nothing users follow changes until EVERYTHING has built and passed its checks:
#   1. build:   image pushed only under an internal sha-<commit> tag; bundle built + smoke-tested
#   2. publish: draft release → move image tags → push dist branch → make release public
# In-app update checks only see a release once it's public, i.e. after every channel is live.
#
# Cut a release with:  pnpm release 1.2.3   (bumps versions, runs checks, tags, pushes)
#
# After the very first publish, make the package public once:
#   GitHub → your org/profile → Packages → mailmcp → Package settings → Change visibility → Public
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      stable: ${{ steps.v.outputs.stable }}
      image: ${{ steps.v.outputs.image }}
      build_tag: ${{ steps.v.outputs.build_tag }}
    steps:
      - id: v
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "build_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (pushed under the internal build tag only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.build_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          build-args: |
            MAILMCP_VERSION=${{ needs.prepare.outputs.version }}
            MAILMCP_REVISION=${{ github.sha }}
            MAILMCP_REPO=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bundle:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the Node.js bundle
        run: pnpm --filter @mailmcp/admin build && node scripts/build-bundle.mjs
        env:
          MAILMCP_VERSION: ${{ needs.prepare.outputs.version }}
          MAILMCP_REVISION: ${{ github.sha }}
          MAILMCP_REPO: ${{ github.repository }}
      - name: Smoke test (starts and serves the database installer)
        run: |
          cd dist/bundle
          HOME="$RUNNER_TEMP/home" PORT=8790 node server.mjs > "$RUNNER_TEMP/bundle.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8790/ | grep -q "Connect a database" && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/bundle.log"; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: node-bundle
          path: dist/mailmcp-node-*.zip

  # Runs only if the image AND the bundle both built: every install method updates together.
  publish:
    needs: [prepare, image, bundle]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
      STABLE: ${{ needs.prepare.outputs.stable }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: node-bundle
          path: dist
      - name: Prepare release assets for this repository
        run: |
          sed "s|__REPO__|${GITHUB_REPOSITORY}|" deploy/install.sh > dist/install.sh
          cp deploy/compose.yml dist/compose.yml
          grep -q "$GITHUB_REPOSITORY" dist/install.sh
          (cd dist && unzip -q mailmcp-node-*.zip)

      - name: 1/4 Draft the GitHub release (stable only; not visible to update checks yet)
        if: env.STABLE == 'true'
        run: |
          # Release notes = this version's section of CHANGELOG.md (falls back to commit titles).
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on && /^\[[^]]+\]: / {exit} on {print}' \
            CHANGELOG.md > dist/notes.md
          if grep -q '[^[:space:]]' dist/notes.md; then NOTES=(--notes-file dist/notes.md); else NOTES=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/install.sh dist/compose.yml dist/mailmcp-node-*.zip \
            --draft --title "MailMCP $GITHUB_REF_NAME" "${NOTES[@]}" --verify-tag

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 2/4 Point the image tags at this build (Docker installs and panels)
        run: |
          if [[ "$STABLE" == "true" ]]; then
            MINOR="${VERSION%.*}"
            docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:$MINOR" -t "$IMAGE:latest" "$IMAGE:$BUILD_TAG"
          else
            docker buildx imagetools create -t "$IMAGE:edge" "$IMAGE:$BUILD_TAG"
          fi

      - name: 3/4 Push the ready-to-run bundle branch (Enhance and other git-deploy hosts)
        run: |
          BRANCH=$([[ "$STABLE" == "true" ]] && echo dist || echo dist-edge)
          cd dist/mailmcp
          git init -q -b "$BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "MailMCP $VERSION (built from $GITHUB_SHA)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

      - name: 4/4 Publish the release (installs now see the update)
        if: env.STABLE == 'true'
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Summary
        run: |
          {
            echo "### MailMCP $VERSION published"
            echo "- Docker image: \`$IMAGE:$([[ "$STABLE" == "true" ]] && echo "$VERSION\` (+ \`latest\`)" || echo 'edge`')"
            echo "- Bundle branch: \`$([[ "$STABLE" == "true" ]] && echo dist || echo dist-edge)\`"
            [[ "$STABLE" == "true" ]] && echo "- Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
            true
          } >> "$GITHUB_STEP_SUMMARY"
