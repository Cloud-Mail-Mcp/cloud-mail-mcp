name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mailmcp
          POSTGRES_PASSWORD: mailmcp
          POSTGRES_DB: mailmcp
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U mailmcp"
          --health-interval 5s
          --health-retries 20
      # Throwaway IMAP/SMTP server for the sync and end-to-end tests.
      greenmail:
        image: greenmail/standalone:2.1.5
        env:
          GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=alice:alice-pass-123@example.test,bob:bob-pass-456@example.test,carol:carol-pass-789@example.test,dave:dave-pass-246@example.test,erin:erin-pass-135@example.test,frank:frank-pass-357@example.test -Dgreenmail.users.login=email -Dgreenmail.startup.timeout=30000"
        ports: ["3025:3025", "3143:3143"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec biome ci .
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrate test database
        run: pnpm db:migrate
      - name: Wait for test mail server
        run: for _ in $(seq 1 60); do nc -z 127.0.0.1 3143 && exit 0; sleep 1; done; exit 1
      - name: Tests (unit, sync integration, MCP end-to-end)
        run: pnpm test
        env:
          LOG_LEVEL: error
      - name: Build admin panel
        run: pnpm --filter @cloud-mail-mcp/admin build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check install.sh
        run: shellcheck -S warning deploy/install.sh deploy/entrypoint.sh
      - name: Validate production compose file
        run: docker compose -f deploy/compose.yml --env-file deploy/.env.production.example config --quiet
