# Development stack (project "mailmcp-dev", so it never collides with a production install
# of deploy/compose.yml on the same machine). Production deployments use deploy/compose.yml.
name: mailmcp-dev

services:
  # The full stack: `docker compose -f deploy/docker-compose.yml up -d`
  # Open http://localhost:8787 and create your admin account.
  mailmcp:
    build: ..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mailmcp:mailmcp@postgres:5432/mailmcp
      # Plain-HTTP local use. Put MailMCP behind HTTPS (Caddy, Traefik, nginx) and remove this
      # line before exposing it to the internet.
      SECURE_COOKIES: "false"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # Holds master.key (encryption key: BACK IT UP) and local mail storage.
      - mailmcpdata:/data

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailmcp
      POSTGRES_PASSWORD: mailmcp
      POSTGRES_DB: mailmcp
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailmcp"]
      interval: 5s
      retries: 10

  # Dev-only fake mail server (IMAP 3143, SMTP 3025, no TLS) with two test mailboxes:
  #   alice@example.test / alice-pass-123     bob@example.test / bob-pass-456
  #   carol@example.test / carol-pass-789     (bob: worker tests, carol: server tests)
  #   docker compose -f deploy/docker-compose.yml --profile testmail up -d
  greenmail:
    image: greenmail/standalone:2.1.5
    profiles: ["testmail"]
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=alice:alice-pass-123@example.test,bob:bob-pass-456@example.test,carol:carol-pass-789@example.test,dave:dave-pass-246@example.test,erin:erin-pass-135@example.test -Dgreenmail.users.login=email -Dgreenmail.startup.timeout=30000"
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3143:3143"

  # Optional S3-compatible storage for testing the S3 storage driver (set it in admin → Settings)
  #   docker compose -f deploy/docker-compose.yml --profile s3 up -d
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mailmcp
      MINIO_ROOT_PASSWORD: mailmcp-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  # Explicit names keep data from before the project was renamed.
  mailmcpdata:
    name: mailmcp_mailmcpdata
  pgdata:
    name: mailmcp_pgdata
  miniodata:
    name: mailmcp_miniodata
